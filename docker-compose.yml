services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: palethoeve
      POSTGRES_USER: palethoeve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palethoeve -d palethoeve"]
      interval: 10s
      timeout: 5s
      retries: 5

  palethoeve:
    build:
      context: .
      dockerfile: Dockerfile
    image: palethoeve-routeplanner:latest
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
